<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ChoirON · 관리자 비밀번호 재설정</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./setup.css"></head><body><main class="setup-shell"><header><span class="setup-brand">ChoirON</span></header><section class="card"><h1>관리자 비밀번호 재설정</h1><p id="account"></p><p id="notice" role="status">재설정 링크를 확인하고 있습니다…</p><form id="reset" hidden><label class="field">새 비밀번호<input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label><label class="field">새 비밀번호 다시 입력<input name="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label><p>8자 이상으로 입력해 주세요. 단원용 숫자 PIN과는 별개입니다.</p><button class="btn" type="submit">새 비밀번호 저장</button></form><a id="return" class="btn secondary" hidden>관리자 로그인으로 이동</a></section></main><script type="module" src="./recovery.js"></script></body></html>
