<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChoirON · 관리자 배포 안내</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./setup.css"></head><body><main class="setup-shell"><header><a class="setup-brand" href="./"><img src="./assets/icon.svg" alt="">ChoirON</a><span class="badge">무료 운영판</span></header><p class="eyebrow">WORKSPACE 관리자 안내</p><h1>새 관리자에게<br>시작 방법을 보내세요.</h1><p>관리자는 자신의 Google 계정에 연결 프로그램을 설치합니다. 이 화면에서는 안내문을 만들고, 선생님 기기에 관리자 목록을 기록할 수 있습니다.</p><section class="card"><form id="distribution"><label class="field">Workspace 이름<input name="name" required maxlength="80"></label><label class="field">관리자 이름 또는 이메일<input name="contact" required maxlength="120"></label><button class="btn" type="submit">설정 안내문 만들기</button></form><div id="result"></div></section><section class="card"><h2>이 기기에 기록한 관리자</h2><p class="muted">자동 초대 발송·가입 승인·연결 상태 확인 기능은 아닙니다. 이 목록은 브라우저에만 저장되며, 다른 기기와 동기화되지 않습니다.</p><div id="list"></div></section><a href="./start.html">직접 설정 시작하기 ↗</a></main><script type="module" src="./distribution.js"></script></body></html>
